name: Watch the guestbook

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    name: Rebuild if the book changed
    runs-on: ubuntu-latest
    steps:
      - name: Compare atabook with the live page
        id: compare
        run: |
          book=$(curl -fsS -m 20 https://ohrt.atabook.org/ | grep -o 'data-time="[0-9]*"' | grep -o '[0-9]*' | awk '{print int($1/1000)}' | sort | tr '\n' ' ') || { echo "atabook unreachable, trying again next time"; exit 0; }
          live=$(curl -fsS -m 20 https://ohrt.dev/guestbook/ | grep -o 'datetime="[^"]*"' | cut -d'"' -f2 | while read -r t; do date -u -d "$t" +%s; done | sort | tr '\n' ' ') || { echo "ohrt.dev unreachable, trying again next time"; exit 0; }
          echo "atabook: $book"
          echo "live:    $live"
          if [ "$book" = "$live" ]; then
            echo "nothing new"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Kick off a deploy
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
